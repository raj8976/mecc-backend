<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MECC | Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- REGISTRATION PAGE -->
    <!-- ============================= -->

    <section class="login-page">

        <div class="login-container">

            <!-- MECC Logo -->
            <div class="login-header">

                <div class="login-logo">
                    MECC
                </div>

                <h1>Create Student Account</h1>

                <p>
                    Register with MECC to access your student portal.
                </p>

            </div>


            <!-- ============================= -->
            <!-- REGISTRATION FORM -->
            <!-- ============================= -->

            <form id="registerForm">

                <!-- FULL NAME -->
                <div class="input-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <!-- PHONE -->
                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- ============================= -->
                <!-- CLASS / COURSE -->
                <!-- ============================= -->

                <div class="input-group">

                    <label for="course">
                        Class / Course
                    </label>

                    <select
                        id="course"
                        name="course"
                        required
                    >

                        <option value="">
                            Select Class / Course
                        </option>


                        <!-- SCHOOL -->
                        <optgroup label="School">

                            <option value="1st Standard">
                                1st Standard
                            </option>

                            <option value="2nd Standard">
                                2nd Standard
                            </option>

                            <option value="3rd Standard">
                                3rd Standard
                            </option>

                            <option value="4th Standard">
                                4th Standard
                            </option>

                            <option value="5th Standard">
                                5th Standard
                            </option>

                            <option value="6th Standard">
                                6th Standard
                            </option>

                            <option value="7th Standard">
                                7th Standard
                            </option>

                            <option value="8th Standard">
                                8th Standard
                            </option>

                            <option value="9th Standard">
                                9th Standard
                            </option>

                            <option value="10th Standard">
                                10th Standard
                            </option>

                            <option value="11th Standard">
                                11th Standard
                            </option>

                            <option value="12th Standard">
                                12th Standard
                            </option>

                        </optgroup>


                        <!-- ============================= -->
                        <!-- GRADUATION -->
                        <!-- ============================= -->

                        <optgroup label="Graduation / Undergraduate">

                            <option value="BSc IT">
                                BSc IT
                            </option>

                            <option value="BSc Computer Science">
                                BSc Computer Science
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="BCom">
                                BCom
                            </option>

                            <option value="BBA">
                                BBA
                            </option>

                            <option value="BA">
                                BA
                            </option>

                            <option value="BMS">
                                BMS
                            </option>

                            <option value="BE / BTech">
                                BE / BTech
                            </option>

                            <option value="Other Graduation">
                                Other Graduation
                            </option>

                        </optgroup>


                        <!-- ============================= -->
                        <!-- POST GRADUATION -->
                        <!-- ============================= -->

                        <optgroup label="Post Graduation">

                            <option value="MSc IT">
                                MSc IT
                            </option>

                            <option value="MSc Computer Science">
                                MSc Computer Science
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="MCom">
                                MCom
                            </option>

                            <option value="MBA">
                                MBA
                            </option>

                            <option value="MA">
                                MA
                            </option>

                            <option value="MTech">
                                MTech
                            </option>

                            <option value="Other Post Graduation">
                                Other Post Graduation
                            </option>

                        </optgroup>


                        <!-- ============================= -->
                        <!-- DIPLOMA -->
                        <!-- ============================= -->

                        <optgroup label="Diploma">

                            <option value="Diploma in IT">
                                Diploma in IT
                            </option>

                            <option value="Diploma in Computer Engineering">
                                Diploma in Computer Engineering
                            </option>

                            <option value="Other Diploma">
                                Other Diploma
                            </option>

                        </optgroup>

                    </select>

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- ============================= -->
                <!-- CREATE ACCOUNT -->
                <!-- ============================= -->

                <button
                    type="submit"
                    class="login-submit"
                >
                    Create Account
                </button>

            </form>


            <!-- ============================= -->
            <!-- LOGIN LINK -->
            <!-- ============================= -->

            <div class="register-link">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Student Login
                    </a>

                </p>

            </div>


            <!-- ============================= -->
            <!-- HOME LINK -->
            <!-- ============================= -->

            <div class="back-home">

                <a href="index.html">
                    ← Back to MECC Home
                </a>

            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
