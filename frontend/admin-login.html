<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECC - Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #2563eb);
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .logo span {
            color: #2563eb;
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #eff6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .title {
            text-align: center;
            color: #475569;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #1e293b;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="admin-icon">
            👨‍💼
        </div>

        <div class="logo">
            MECC<span>.</span>
        </div>

        <div class="title">
            Administrator Login
        </div>

        <form id="adminLoginForm">

            <div class="input-group">
                <label for="email">Admin Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                Login as Admin
            </button>

        </form>

        <div id="message"></div>

        <a href="login.html" class="back">
            ← Back to Student Login
        </a>

    </div>

    <script>
        const API_URL = "http://localhost:3000";

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                const loginButton =
                    document.getElementById("loginButton");

                message.style.display = "none";

                loginButton.disabled = true;
                loginButton.textContent = "Logging in...";

                try {

                    const response = await fetch(
                        API_URL + "/admin-login",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.message || "Admin login failed"
                        );
                    }

                    localStorage.setItem(
                        "admin",
                        JSON.stringify(data.admin)
                    );

                    message.className = "success";
                    message.textContent =
                        "Admin login successful!";

                    message.style.display = "block";

                    setTimeout(function () {
                        window.location.href =
                            "admin-dashboard.html";
                    }, 700);

                } catch (error) {

                    message.className = "error";

                    message.textContent =
                        error.message ||
                        "Unable to connect to MECC server.";

                    message.style.display = "block";

                } finally {

                    loginButton.disabled = false;
                    loginButton.textContent = "Login as Admin";
                }

            });
    </script>

</body>
</html>
