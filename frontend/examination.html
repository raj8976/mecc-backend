<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECC - Examination</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #f0f0f0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .welcome-card h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: #666;
            margin: 5px 0;
        }

        .summary-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .summary-card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .summary-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .section-title {
            margin-bottom: 15px;
            font-size: 24px;
            color: #333;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f9ff;
        }

        .percentage {
            font-weight: bold;
            color: #667eea;
        }

        .remarks {
            color: #555;
        }

        .message {
            text-align: center;
            padding: 35px;
            color: #666;
            font-size: 17px;
        }

        .loading {
            text-align: center;
            padding: 35px;
            color: #667eea;
            font-size: 18px;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {

            .navbar {
                padding: 15px;
            }

            .logo {
                font-size: 20px;
            }

            .container {
                margin: 20px auto;
            }

            .summary-container {
                grid-template-columns: 1fr;
            }

            table {
                min-width: 850px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">MECC</div>

        <button class="back-btn" onclick="goBack()">
            ← Back to Dashboard
        </button>
    </div>

    <div class="container">

        <div class="welcome-card">
            <h1>Examination & Test Scores</h1>

            <p>
                Student:
                <strong id="studentName">Loading...</strong>
            </p>

            <p>
                Course:
                <strong id="studentCourse">Loading...</strong>
            </p>
        </div>

        <div id="errorMessage" class="error"></div>

        <div class="summary-container">

            <div class="summary-card">
                <h3>Total Tests</h3>
                <div class="value" id="totalTests">0</div>
            </div>

            <div class="summary-card">
                <h3>Average Percentage</h3>
                <div class="value" id="averagePercentage">0%</div>
            </div>

            <div class="summary-card">
                <h3>Total Marks</h3>
                <div class="value" id="marksSummary">0/0</div>
            </div>

        </div>

        <h2 class="section-title">My Test Results</h2>

        <div class="table-container">

            <div id="loading" class="loading">
                Loading test scores...
            </div>

            <div id="noData" class="message" style="display:none;">
                No test score records available yet.
            </div>

            <table id="scoreTable" style="display:none;">

                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Test Name</th>
                        <th>Subject</th>
                        <th>Total Marks</th>
                        <th>Obtained Marks</th>
                        <th>Percentage</th>
                        <th>Exam Date</th>
                        <th>Remarks</th>
                    </tr>
                </thead>

                <tbody id="scoreTableBody"></tbody>

            </table>

        </div>

    </div>

    <script>

        const API_BASE_URL = "http://localhost:3000";

        let studentId = null;
        let scores = [];

        document.addEventListener("DOMContentLoaded", function () {
            loadStudent();
        });

        function loadStudent() {

            try {

                const studentData = localStorage.getItem("student");

                if (!studentData) {
                    alert("Please login first.");
                    window.location.href = "login.html";
                    return;
                }

                const student = JSON.parse(studentData);

                studentId =
                    student.id ||
                    student.student_id ||
                    student.studentId;

                if (!studentId) {
                    showError("Student ID not found. Please login again.");
                    return;
                }

                document.getElementById("studentName").textContent =
                    student.full_name ||
                    student.fullName ||
                    student.name ||
                    "Student";

                document.getElementById("studentCourse").textContent =
                    student.course ||
                    "Not Available";

                loadTestScores();

            } catch (error) {

                console.error(error);

                showError("Unable to read student information.");

            }
        }

        async function loadTestScores() {

            document.getElementById("loading").style.display = "block";
            document.getElementById("scoreTable").style.display = "none";
            document.getElementById("noData").style.display = "none";

            try {

                const response = await fetch(
                    `${API_BASE_URL}/test-scores/${studentId}`
                );

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Unable to load test scores."
                    );

                }

                scores =
                    data.testScores ||
                    data.scores ||
                    [];

                document.getElementById("loading").style.display = "none";

                if (scores.length === 0) {

                    document.getElementById("noData").style.display = "block";

                    updateSummary();

                    return;
                }

                displayScores();
                updateSummary();

            } catch (error) {

                console.error("Test score error:", error);

                document.getElementById("loading").style.display = "none";

                showError(
                    "Unable to load test scores. Please make sure the MECC server is running."
                );
            }
        }

        function displayScores() {

            const table = document.getElementById("scoreTable");
            const tbody = document.getElementById("scoreTableBody");

            tbody.innerHTML = "";

            scores.forEach(function (score, index) {

                const totalMarks =
                    Number(score.total_marks) || 0;

                const obtainedMarks =
                    Number(score.obtained_marks) || 0;

                let percentage = 0;

                if (totalMarks > 0) {
                    percentage =
                        (obtainedMarks / totalMarks) * 100;
                }

                let examDate = "-";

                if (score.exam_date) {

                    const date =
                        new Date(score.exam_date);

                    if (!isNaN(date.getTime())) {

                        examDate =
                            date.toLocaleDateString("en-IN");
                    }
                }

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${index + 1}</td>

                    <td>
                        <strong>
                            ${escapeHtml(score.test_name || "-")}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(score.subject || "-")}
                    </td>

                    <td>
                        ${totalMarks}
                    </td>

                    <td>
                        ${obtainedMarks}
                    </td>

                    <td class="percentage">
                        ${percentage.toFixed(2)}%
                    </td>

                    <td>
                        ${examDate}
                    </td>

                    <td class="remarks">
                        ${escapeHtml(score.remarks || "-")}
                    </td>
                `;

                tbody.appendChild(row);

            });

            table.style.display = "table";
        }

        function updateSummary() {

            const totalTests = scores.length;

            document.getElementById("totalTests").textContent =
                totalTests;

            if (totalTests === 0) {

                document.getElementById("averagePercentage").textContent =
                    "0%";

                document.getElementById("marksSummary").textContent =
                    "0/0";

                return;
            }

            let totalMarks = 0;
            let obtainedMarks = 0;

            scores.forEach(function (score) {

                totalMarks +=
                    Number(score.total_marks) || 0;

                obtainedMarks +=
                    Number(score.obtained_marks) || 0;
            });

            let averagePercentage = 0;

            if (totalMarks > 0) {

                averagePercentage =
                    (obtainedMarks / totalMarks) * 100;
            }

            document.getElementById("averagePercentage").textContent =
                averagePercentage.toFixed(2) + "%";

            document.getElementById("marksSummary").textContent =
                `${obtainedMarks}/${totalMarks}`;
        }

        function showError(message) {

            const errorBox =
                document.getElementById("errorMessage");

            errorBox.textContent = message;
            errorBox.style.display = "block";
        }

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function goBack() {

            window.location.href = "dashboard.html";
        }

    </script>

</body>
</html>
