<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECC - Fees</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .navbar {
            height: 70px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .amount {
            font-size: 30px;
            font-weight: bold;
        }

        .total {
            color: #2563eb;
        }

        .paid {
            color: #16a34a;
        }

        .pending {
            color: #dc2626;
        }

        .details {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .details h2 {
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #64748b;
        }

        .value {
            font-weight: bold;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status.paid {
            background: #dcfce7;
            color: #15803d;
        }

        .status.partial {
            background: #fef3c7;
            color: #b45309;
        }

        .status.pending-status {
            background: #fee2e2;
            color: #b91c1c;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .no-data {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
            display: none;
            background: white;
            border-radius: 18px;
        }

        .refresh-btn {
            margin-top: 20px;
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 750px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 18px;
            }

            .container {
                margin-top: 25px;
            }

            .heading h1 {
                font-size: 26px;
            }

            .row {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">
            MECC<span>.</span>
        </div>

        <button class="back-btn" onclick="goBack()">
            ← Dashboard
        </button>
    </div>

    <div class="container">

        <div class="heading">
            <h1>Fees Overview</h1>
            <p>View your complete fee payment information</p>
        </div>

        <div id="errorBox" class="error"></div>

        <div id="loading" class="loading">
            Loading fee information...
        </div>

        <div id="noData" class="no-data">
            <h2>No Fee Record Found</h2>
            <p>Your fee information has not been added yet.</p>

            <button class="refresh-btn" onclick="loadFees()">
                Refresh
            </button>
        </div>

        <div id="feeContent" style="display: none;">

            <div class="cards">

                <div class="card">
                    <div class="card-title">
                        Total Fees
                    </div>

                    <div class="amount total" id="totalFees">
                        ₹0
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        Paid Fees
                    </div>

                    <div class="amount paid" id="paidFees">
                        ₹0
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        Pending Fees
                    </div>

                    <div class="amount pending" id="pendingFees">
                        ₹0
                    </div>
                </div>

            </div>

            <div class="details">

                <h2>Payment Details</h2>

                <div class="row">
                    <span class="label">
                        Payment Status
                    </span>

                    <span id="paymentStatus" class="status">
                    </span>
                </div>

                <div class="row">
                    <span class="label">
                        Last Payment Date
                    </span>

                    <span class="value" id="lastPaymentDate">
                    </span>
                </div>

                <div class="row">
                    <span class="label">
                        Student ID
                    </span>

                    <span class="value" id="studentId">
                    </span>
                </div>

            </div>

        </div>

    </div>

    <script>

        const API_URL = "http://localhost:3000";

        async function loadFees() {

            const loading = document.getElementById("loading");
            const feeContent = document.getElementById("feeContent");
            const noData = document.getElementById("noData");
            const errorBox = document.getElementById("errorBox");

            loading.style.display = "block";
            feeContent.style.display = "none";
            noData.style.display = "none";
            errorBox.style.display = "none";

            try {

                /*
                 * Student ID 1
                 * Backend se isi student ka fee record aa raha hai.
                 */
                const studentId = 1;

                document.getElementById("studentId").textContent = studentId;

                const response = await fetch(
                    API_URL + "/fees/" + studentId
                );

                if (!response.ok) {
                    throw new Error(
                        "Server error: " + response.status
                    );
                }

                const data = await response.json();

                console.log("Fees API Response:", data);

                loading.style.display = "none";

                if (data.success === true && data.fees) {

                    const fees = data.fees;

                    document.getElementById("totalFees").textContent =
                        formatMoney(fees.total_fees);

                    document.getElementById("paidFees").textContent =
                        formatMoney(fees.paid_fees);

                    document.getElementById("pendingFees").textContent =
                        formatMoney(fees.pending_fees);

                    document.getElementById("studentId").textContent =
                        studentId;

                    document.getElementById("lastPaymentDate").textContent =
                        formatDate(fees.last_payment_date);

                    const statusElement =
                        document.getElementById("paymentStatus");

                    const status =
                        fees.payment_status || "Pending";

                    statusElement.textContent = status;

                    statusElement.className = "status";

                    if (status.toLowerCase() === "paid") {

                        statusElement.classList.add("paid");

                    } else if (status.toLowerCase() === "partial") {

                        statusElement.classList.add("partial");

                    } else {

                        statusElement.classList.add("pending-status");

                    }

                    feeContent.style.display = "block";

                } else {

                    noData.style.display = "block";

                }

            } catch (error) {

                console.error("Fees Error:", error);

                loading.style.display = "none";

                errorBox.style.display = "block";

                errorBox.textContent =
                    "Unable to connect to MECC server: " +
                    error.message;

            }

        }

        function formatMoney(value) {

            const number = Number(value || 0);

            return "₹" +
                number.toLocaleString("en-IN");

        }

        function formatDate(value) {

            if (!value) {
                return "Not available";
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }

        function goBack() {

            window.location.href = "dashboard.html";

        }

        loadFees();

    </script>

</body>
</html>
