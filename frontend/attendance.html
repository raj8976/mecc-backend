<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MECC - Attendance Management</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f1f5f9;
            color: #1e293b;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }


        .logo {
            font-size: 25px;
            font-weight: bold;
        }


        .logo span {
            color: #60a5fa;
        }


        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .admin-name {
            margin-right: 8px;
            color: #e5e7eb;
        }


        .dashboard-btn,
        .logout-btn {
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }


        .dashboard-btn {
            background: #2563eb;
        }


        .dashboard-btn:hover {
            background: #1d4ed8;
        }


        .logout-btn {
            background: #dc2626;
        }


        .logout-btn:hover {
            background: #b91c1c;
        }



        /* ================= CONTAINER ================= */

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }


        .page-header {
            margin-bottom: 25px;
        }


        .page-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }


        .page-header p {
            color: #64748b;
        }



        /* ================= CARDS ================= */

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);
        }


        .card-title {
            font-size: 21px;
            margin-bottom: 20px;
        }



        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
        }


        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

            background: white;
        }


        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }


        .submit-btn {

            margin-top: 20px;

            background: #2563eb;

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }


        .submit-btn:hover {
            background: #1d4ed8;
        }


        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }



        /* ================= MESSAGE ================= */

        .message {

            display: none;

            margin-top: 15px;

            padding: 11px 14px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: bold;
        }


        .message.success {

            background: #dcfce7;

            color: #15803d;
        }


        .message.error {

            background: #fee2e2;

            color: #b91c1c;
        }



        /* ================= VIEW SECTION ================= */

        .view-controls {

            display: flex;

            gap: 15px;

            align-items: end;

            margin-bottom: 20px;
        }


        .student-selector {

            width: 400px;
            max-width: 100%;
        }



        /* ================= TABLE ================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 650px;
        }


        th {

            background: #f8fafc;

            color: #475569;

            text-align: left;

            padding: 14px;

            font-size: 14px;
        }


        td {

            padding: 14px;

            border-bottom:
                1px solid #e2e8f0;

            font-size: 14px;
        }


        tbody tr:hover {
            background: #f8fafc;
        }


        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        .status.present {

            background: #dcfce7;

            color: #15803d;
        }


        .status.absent {

            background: #fee2e2;

            color: #dc2626;
        }


        .status.other {

            background: #e0e7ff;

            color: #3730a3;
        }


        .empty {

            text-align: center;

            padding: 35px;

            color: #64748b;
        }



        /* ================= SUMMARY ================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }


        .summary-card {

            background: #f8fafc;

            border-radius: 12px;

            padding: 18px;

            border: 1px solid #e2e8f0;
        }


        .summary-card h3 {

            font-size: 13px;

            color: #64748b;

            margin-bottom: 8px;
        }


        .summary-card strong {

            font-size: 25px;
        }


        .present-number {
            color: #15803d;
        }


        .absent-number {
            color: #dc2626;
        }



        /* ================= LOADING ================= */

        .loading {

            text-align: center;

            padding: 25px;

            color: #64748b;
        }



        /* ================= RESPONSIVE ================= */

        @media(max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }


            .summary-grid {
                grid-template-columns: 1fr;
            }


            .view-controls {
                flex-direction: column;

                align-items: stretch;
            }


            .student-selector {
                width: 100%;
            }

        }


        @media(max-width: 600px) {

            .navbar {

                padding: 0 15px;

            }


            .admin-name {
                display: none;
            }


            .logo {
                font-size: 22px;
            }


            .dashboard-btn,
            .logout-btn {
                padding: 8px 10px;
                font-size: 12px;
            }


            .container {

                margin-top: 25px;

                padding: 0 12px;

            }


            .card {

                padding: 18px;

            }


            .page-header h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <div class="navbar">


        <div class="logo">

            MECC<span>.</span>

        </div>


        <div class="nav-right">


            <span
                class="admin-name"
                id="adminName">

                Admin

            </span>


            <button
                class="dashboard-btn"
                onclick="goDashboard()">

                Dashboard

            </button>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>


        </div>


    </div>



    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <h1>
                Attendance Management
            </h1>

            <p>
                Mark and manage student attendance.
            </p>

        </div>



        <!-- =================================================
             MARK ATTENDANCE
        ================================================== -->

        <div class="card">


            <h2 class="card-title">
                Mark Attendance
            </h2>


            <form
                id="attendanceForm"
                onsubmit="addAttendance(event)">


                <div class="form-grid">


                    <!-- STUDENT -->

                    <div class="form-group">

                        <label>
                            Select Student *
                        </label>


                        <select
                            id="studentId"
                            required>

                            <option value="">
                                Loading students...
                            </option>

                        </select>

                    </div>



                    <!-- DATE -->

                    <div class="form-group">

                        <label>
                            Attendance Date *
                        </label>


                        <input
                            type="date"
                            id="attendanceDate"
                            required>

                    </div>



                    <!-- STATUS -->

                    <div class="form-group">

                        <label>
                            Attendance Status *
                        </label>


                        <select
                            id="status"
                            required>

                            <option value="">
                                Select Status
                            </option>

                            <option value="Present">
                                Present
                            </option>

                            <option value="Absent">
                                Absent
                            </option>

                        </select>

                    </div>



                    <!-- SUBJECT -->

                    <div class="form-group">

                        <label>
                            Subject *
                        </label>


                        <input
                            type="text"
                            id="subject"
                            placeholder="Example: Mathematics"
                            required>

                    </div>


                </div>



                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn">

                    Mark Attendance

                </button>


            </form>



            <div
                id="message"
                class="message">

            </div>


        </div>



        <!-- =================================================
             ATTENDANCE RECORD
        ================================================== -->

        <div class="card">


            <h2 class="card-title">
                Attendance Records
            </h2>



            <!-- STUDENT SELECTOR -->

            <div class="view-controls">


                <div
                    class="form-group student-selector">


                    <label>
                        Select Student
                    </label>


                    <select
                        id="viewStudent"
                        onchange="loadAttendance()">

                        <option value="">
                            Select Student
                        </option>

                    </select>


                </div>


            </div>



            <!-- SUMMARY -->

            <div
                class="summary-grid"
                id="summaryGrid"
                style="display:none;">


                <div class="summary-card">

                    <h3>
                        Total Classes
                    </h3>

                    <strong
                        id="totalClasses">

                        0

                    </strong>

                </div>


                <div class="summary-card">

                    <h3>
                        Present
                    </h3>

                    <strong
                        class="present-number"
                        id="presentCount">

                        0

                    </strong>

                </div>


                <div class="summary-card">

                    <h3>
                        Absent
                    </h3>

                    <strong
                        class="absent-number"
                        id="absentCount">

                        0

                    </strong>

                </div>


            </div>



            <!-- TABLE -->

            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Subject
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="attendanceTable">


                        <tr>

                            <td
                                colspan="4"
                                class="empty">

                                Select a student to view
                                attendance.

                            </td>

                        </tr>


                    </tbody>


                </table>


            </div>


        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        // =================================================
        // API URL
        // =================================================

        const API_URL =
            "http://localhost:3000";



        // =================================================
        // ADMIN LOGIN CHECK
        // =================================================

        const adminData =
            localStorage.getItem("admin");


        if (!adminData) {

            window.location.href =
                "admin-login.html";

        }
        else {

            try {

                const admin =
                    JSON.parse(adminData);


                document.getElementById(
                    "adminName"
                ).textContent =
                    admin.full_name ||
                    "Admin";

            }
            catch (error) {

                console.error(
                    "Admin data error:",
                    error
                );


                localStorage.removeItem(
                    "admin"
                );


                window.location.href =
                    "admin-login.html";

            }

        }



        // =================================================
        // SET TODAY'S DATE
        // =================================================

        function setTodayDate() {

            const today =
                new Date();


            const year =
                today.getFullYear();


            const month =
                String(
                    today.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    today.getDate()
                ).padStart(
                    2,
                    "0"
                );


            document.getElementById(
                "attendanceDate"
            ).value =
                year +
                "-" +
                month +
                "-" +
                day;

        }



        // =================================================
        // LOAD STUDENTS
        // =================================================

        async function loadStudents() {


            const addStudentSelect =
                document.getElementById(
                    "studentId"
                );


            const viewStudentSelect =
                document.getElementById(
                    "viewStudent"
                );


            addStudentSelect.innerHTML = `

                <option value="">
                    Loading students...
                </option>

            `;


            viewStudentSelect.innerHTML = `

                <option value="">
                    Loading students...
                </option>

            `;


            try {


                const response =
                    await fetch(
                        API_URL +
                        "/admin/students"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load students"
                    );

                }


                const students =
                    data.students || [];


                if (
                    students.length === 0
                ) {

                    addStudentSelect.innerHTML = `

                        <option value="">
                            No students found
                        </option>

                    `;


                    viewStudentSelect.innerHTML = `

                        <option value="">
                            No students found
                        </option>

                    `;


                    return;

                }



                addStudentSelect.innerHTML = `

                    <option value="">
                        Select Student
                    </option>

                `;


                viewStudentSelect.innerHTML = `

                    <option value="">
                        Select Student
                    </option>

                `;



                students.forEach(
                    function(student) {


                        const option1 =
                            document.createElement(
                                "option"
                            );


                        option1.value =
                            student.id;


                        option1.textContent =
                            student.full_name +
                            " - " +
                            student.course;


                        addStudentSelect
                            .appendChild(
                                option1
                            );



                        const option2 =
                            document.createElement(
                                "option"
                            );


                        option2.value =
                            student.id;


                        option2.textContent =
                            student.full_name +
                            " - " +
                            student.course;


                        viewStudentSelect
                            .appendChild(
                                option2
                            );


                    }
                );


            }
            catch (error) {


                console.error(
                    "Load students error:",
                    error
                );


                addStudentSelect.innerHTML = `

                    <option value="">
                        Unable to load students
                    </option>

                `;


                viewStudentSelect.innerHTML = `

                    <option value="">
                        Unable to load students
                    </option>

                `;


                showMessage(
                    error.message,
                    "error"
                );

            }

        }



        // =================================================
        // ADD ATTENDANCE
        // =================================================

        async function addAttendance(
            event
        ) {


            event.preventDefault();


            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );


            const studentId =
                document.getElementById(
                    "studentId"
                ).value;


            const attendanceDate =
                document.getElementById(
                    "attendanceDate"
                ).value;


            const status =
                document.getElementById(
                    "status"
                ).value;


            const subject =
                document.getElementById(
                    "subject"
                ).value.trim();



            // VALIDATION

            if (!studentId) {

                showMessage(
                    "Please select a student.",
                    "error"
                );

                return;

            }


            if (!attendanceDate) {

                showMessage(
                    "Please select attendance date.",
                    "error"
                );

                return;

            }


            if (!status) {

                showMessage(
                    "Please select attendance status.",
                    "error"
                );

                return;

            }


            if (!subject) {

                showMessage(
                    "Please enter subject.",
                    "error"
                );

                return;

            }



            submitBtn.disabled = true;

            submitBtn.textContent =
                "Saving...";



            try {


                const response =
                    await fetch(

                        API_URL +
                        "/attendance",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    studentId:
                                        Number(
                                            studentId
                                        ),

                                    attendanceDate:
                                        attendanceDate,

                                    status:
                                        status,

                                    subject:
                                        subject

                                })

                        }

                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to add attendance"
                    );

                }



                showMessage(
                    "Attendance marked successfully!",
                    "success"
                );



                // Save selected student
                const selectedStudent =
                    studentId;



                // Reset form
                document.getElementById(
                    "attendanceForm"
                ).reset();



                // Set today's date again
                setTodayDate();



                // Keep same student selected
                document.getElementById(
                    "studentId"
                ).value =
                    selectedStudent;



                // Automatically show updated records
                document.getElementById(
                    "viewStudent"
                ).value =
                    selectedStudent;


                await loadAttendance();



            }
            catch (error) {


                console.error(
                    "Attendance error:",
                    error
                );


                showMessage(
                    error.message,
                    "error"
                );

            }
            finally {

                submitBtn.disabled =
                    false;

                submitBtn.textContent =
                    "Mark Attendance";

            }

        }



        // =================================================
        // LOAD ATTENDANCE
        // =================================================

        async function loadAttendance() {


            const studentId =
                document.getElementById(
                    "viewStudent"
                ).value;


            const table =
                document.getElementById(
                    "attendanceTable"
                );


            const summaryGrid =
                document.getElementById(
                    "summaryGrid"
                );



            if (!studentId) {


                summaryGrid.style.display =
                    "none";


                table.innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="empty">

                            Select a student to view
                            attendance.

                        </td>

                    </tr>

                `;


                return;

            }



            table.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="loading">

                        Loading attendance...

                    </td>

                </tr>

            `;



            try {


                const response =
                    await fetch(

                        API_URL +
                        "/attendance/" +
                        studentId

                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load attendance"
                    );

                }


                const attendance =
                    data.attendance || [];



                // ================================
                // SUMMARY
                // ================================

                const total =
                    attendance.length;


                const present =
                    attendance.filter(
                        function(record) {

                            return String(
                                record.status
                            ).toLowerCase() ===
                            "present";

                        }
                    ).length;


                const absent =
                    attendance.filter(
                        function(record) {

                            return String(
                                record.status
                            ).toLowerCase() ===
                            "absent";

                        }
                    ).length;



                document.getElementById(
                    "totalClasses"
                ).textContent =
                    total;


                document.getElementById(
                    "presentCount"
                ).textContent =
                    present;


                document.getElementById(
                    "absentCount"
                ).textContent =
                    absent;


                summaryGrid.style.display =
                    "grid";



                // ================================
                // NO RECORDS
                // ================================

                if (attendance.length === 0) {


                    table.innerHTML = `

                        <tr>

                            <td
                                colspan="4"
                                class="empty">

                                No attendance records
                                found for this student.

                            </td>

                        </tr>

                    `;


                    return;

                }



                // ================================
                // TABLE
                // ================================

                table.innerHTML =
                    attendance.map(
                        function(record) {


                            let statusClass =
                                "other";


                            if (
                                String(
                                    record.status
                                ).toLowerCase() ===
                                "present"
                            ) {

                                statusClass =
                                    "present";

                            }
                            else if (
                                String(
                                    record.status
                                ).toLowerCase() ===
                                "absent"
                            ) {

                                statusClass =
                                    "absent";

                            }



                            return `

                                <tr>

                                    <td>
                                        ${record.id}
                                    </td>

                                    <td>
                                        ${formatDate(
                                            record.attendance_date
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHtml(
                                            record.subject
                                        )}
                                    </td>

                                    <td>

                                        <span
                                            class="status ${statusClass}">

                                            ${escapeHtml(
                                                record.status
                                            )}

                                        </span>

                                    </td>

                                </tr>

                            `;

                        }
                    ).join("");


            }
            catch (error) {


                console.error(
                    "Load attendance error:",
                    error
                );


                summaryGrid.style.display =
                    "none";


                table.innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="empty">

                            Unable to load attendance.

                            <br><br>

                            ${escapeHtml(
                                error.message
                            )}

                        </td>

                    </tr>

                `;

            }

        }



        // =================================================
        // SHOW MESSAGE
        // =================================================

        function showMessage(
            text,
            type
        ) {


            const message =
                document.getElementById(
                    "message"
                );


            message.className =
                "message " +
                type;


            message.textContent =
                text;


            message.style.display =
                "block";


            setTimeout(
                function() {

                    message.style.display =
                        "none";

                },
                4000
            );

        }



        // =================================================
        // FORMAT DATE
        // =================================================

        function formatDate(
            dateValue
        ) {


            if (!dateValue) {
                return "-";
            }


            // MySQL DATE format:
            // YYYY-MM-DD

            const parts =
                String(
                    dateValue
                ).split("T")[0]
                .split("-");


            if (parts.length === 3) {

                return (
                    parts[2] +
                    "/" +
                    parts[1] +
                    "/" +
                    parts[0]
                );

            }


            return String(
                dateValue
            );

        }



        // =================================================
        // HTML SECURITY
        // =================================================

        function escapeHtml(
            value
        ) {


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =================================================
        // GO TO DASHBOARD
        // =================================================

        function goDashboard() {


            window.location.href =
